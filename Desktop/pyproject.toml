[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adr-desktop"
version = "0.1.0"
description = "Local-first agent insights, file protection, and credential brokering"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "adr-sensor==1.1.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "httpx>=0.28", "ruff>=0.11", "pyinstaller>=6.16,<7", "playwright>=1.55,<2",
    "import-linter>=2.1,<3",
]

[project.scripts]
adr-desktop = "adr_desktop.cli:main"

[tool.uv.sources]
adr-sensor = { path = "../Sensor", editable = true }

[tool.setuptools.packages.find]
include = ["adr_desktop*"]

[tool.setuptools.package-data]
adr_desktop = ["web/*", "native/*.c", "bin/*", "adapters/*.js", "plugins/*.json", "detection/inline/feed/*.json",
    "detection/review/config/*.json", "detection/review/prompts/*.txt", "detection/review/sql/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.importlinter]
root_packages = ["adr_desktop", "adr_sensor", "adr_discovery"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Sensor and Discovery do not import Desktop"
type = "forbidden"
source_modules = ["adr_sensor", "adr_discovery"]
forbidden_modules = ["adr_desktop"]

[[tool.importlinter.contracts]]
name = "Sensor and Discovery do not import each other"
type = "independence"
modules = ["adr_sensor", "adr_discovery"]

[[tool.importlinter.contracts]]
name = "Sensor's and Discovery's api modules sit on top: nothing inside the packages imports them"
type = "layers"
containers = ["adr_sensor", "adr_discovery"]
# Every top-level module is listed, so a new one fails here until it is also added to the
# Desktop contract below. Parentheses mark a module only one of the two packages has.
exhaustive = true
layers = [
    "api",
    """cli : (archive) : (catalog) : (contracts) : (coverage) : (diagnostics) : (enumerator) : (exporters) :
    (extractor) : (host_identity) : (identifier) : (judge) : (observer) : (parsers) : (pipeline) :
    (redact) : (reporter) : (resolver) : (schemas) : (sensor_log) : (utils) : (world)""",
]

[[tool.importlinter.contracts]]
name = "Desktop uses Sensor and Discovery only through their api modules"
type = "forbidden"
source_modules = ["adr_desktop"]
# Every top-level module of the two packages except api.
forbidden_modules = [
    "adr_sensor.cli",
    "adr_sensor.diagnostics",
    "adr_sensor.exporters",
    "adr_sensor.host_identity",
    "adr_sensor.observer",
    "adr_sensor.parsers",
    "adr_sensor.schemas",
    "adr_sensor.sensor_log",
    "adr_sensor.utils",
    "adr_discovery.archive",
    "adr_discovery.catalog",
    "adr_discovery.cli",
    "adr_discovery.contracts",
    "adr_discovery.coverage",
    "adr_discovery.enumerator",
    "adr_discovery.extractor",
    "adr_discovery.identifier",
    "adr_discovery.judge",
    "adr_discovery.pipeline",
    "adr_discovery.redact",
    "adr_discovery.reporter",
    "adr_discovery.resolver",
    "adr_discovery.world",
]
# The api modules import the internals themselves.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Desktop does not import the Sensor and Discovery package roots, which re-export internals"
type = "forbidden"
source_modules = ["adr_desktop", "adr_desktop.**"]
forbidden_modules = ["adr_sensor", "adr_discovery"]
# Only the two root modules: as packages they would include the api modules.
as_packages = false
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The hook does not import the server, runtime, API, store, database, reviews, Sensor or Discovery"
type = "forbidden"
source_modules = ["adr_desktop.hooks", "adr_desktop.prompt_guard"]
forbidden_modules = [
    "fastapi",
    "uvicorn",
    "starlette",
    "adr_desktop.runtime",
    "adr_desktop.api",
    "adr_desktop.store",
    "adr_desktop.storage.database",
    "adr_desktop.detection.review",
    "adr_desktop.security_reviews",
    "adr_sensor",
    "adr_discovery",
]

[[tool.importlinter.contracts]]
name = "Hooks, agent plugins and MCP trust get agent facts from integrations.agents, with no cycle"
type = "layers"
layers = [
    "adr_desktop.agent_plugins",
    "adr_desktop.hooks",
    "adr_desktop.mcp_trust",
    "adr_desktop.integrations.agents",
]

[[tool.importlinter.contracts]]
name = "Desktop's subpackages import no flat Desktop module, and each imports only the layers below it"
type = "layers"
containers = ["adr_desktop"]
# Every module in adr_desktop is listed, so a new one fails here until it is placed in a layer.
exhaustive = true
layers = [
    """__main__ : access_status : agent_plugins : api : approval_queue : cli : collector : config :
    conversation_view : credential_activity : evaluate : guard : hooks : local_client : mcp_server :
    mcp_trust : native : prompt_guard : runtime : security_reviews : store : threat_feed :
    threat_protection""",
    "integrations",
    "protection | vault",
    "detection",
    "storage",
]

[[tool.importlinter.contracts]]
name = "Detection's review part imports no Desktop module except storage's file helpers and clock"
type = "forbidden"
source_modules = ["adr_desktop.detection.review"]
# The layers contract above already keeps all of detection off Desktop's other modules. Review gets
# the database from Desktop, so it does not import the rest of storage either.
forbidden_modules = ["adr_desktop.storage.database", "adr_desktop.storage.ids"]

[[tool.importlinter.contracts]]
name = "The feed engine imports nothing from Desktop outside itself, Sensor, Discovery or the server"
type = "forbidden"
source_modules = ["adr_desktop.detection.inline.feed"]
# The engine stands alone on the standard library. A wildcard skips the package that contains the
# feed, so these three cover every other Desktop module.
forbidden_modules = [
    "adr_desktop.*",
    "adr_desktop.detection.*",
    "adr_desktop.detection.inline.*",
    "adr_sensor",
    "adr_discovery",
    "fastapi",
    "uvicorn",
    "starlette",
]

[[tool.importlinter.contracts]]
name = "Protection imports no storage, Sensor or Discovery: with the layers, nothing but detection"
type = "forbidden"
source_modules = ["adr_desktop.protection"]
forbidden_modules = ["adr_desktop.storage", "adr_sensor", "adr_discovery"]
# What detection itself imports is detection's own contract.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Vault imports no Sensor or Discovery: with the layers, nothing but detection and storage"
type = "forbidden"
source_modules = ["adr_desktop.vault"]
forbidden_modules = ["adr_sensor", "adr_discovery"]
# What detection itself imports is detection's own contract.
allow_indirect_imports = true
