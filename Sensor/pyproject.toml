[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adr-sensor"
version = "1.0.0"
description = "ADR Sensor - Agentic Detection & Response: Security observability for AI coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "ADR Project Contributors" },
]
keywords = ["security", "ai-agents", "observability", "threat-detection", "mcp", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tabulate>=0.9.0",
    # Discovery reads Codex's TOML config. Parsing it with a subset of the
    # grammar loses quoted keys and any comma inside a string, so a compliant
    # parser is a dependency rather than a nicety.
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.0",
]

[project.scripts]
adr-sensor = "adr_sensor.cli:main"

[project.urls]
Homepage = "https://github.com/uber/ADR"
Documentation = "https://github.com/uber/ADR/tree/main/Sensor"
Repository = "https://github.com/uber/ADR"
Issues = "https://github.com/uber/ADR/issues"

[tool.setuptools.packages.find]
include = ["adr_sensor*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
