name: Discovery Windows parsing

on:
  workflow_dispatch:
  push:
    branches: [codex/discovery-windows-parsing]
  pull_request:
    branches: [main]
    paths:
      - Discovery/**
      - .github/workflows/discovery-windows-parsing.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-parsing:
    name: Windows parsing (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: Discovery
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Command lines, BOM decoding and profile file boundaries
        run: uv run --python ${{ matrix.python-version }} pytest adr_discovery/tests_unit/test_windows_parsing.py adr_discovery/tests_unit/test_import_rules.py -q

  linux-regression:
    name: Linux Discovery regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Discovery
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --extra dev --python 3.11
      - run: uv run --python 3.11 pytest -q
      - run: uv run --python 3.11 ruff check .
