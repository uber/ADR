name: Discovery Windows coverage

on:
  push:
    branches: [codex/discovery-windows-coverage]
  pull_request:
    branches: [main]
    paths:
      - 'Discovery/**'
      - '.github/workflows/discovery-windows-coverage.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-coverage:
    name: Windows coverage (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: Discovery
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest adr_discovery/tests_unit/test_windows_coverage.py -q

  linux-regression:
    name: Linux Discovery regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Discovery
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.11
      - run: uv sync --extra dev --python 3.11
      - run: uv run --python 3.11 pytest -q
      - run: uv run --python 3.11 ruff check .
