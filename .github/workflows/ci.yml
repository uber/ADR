name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-detection:
    name: Detection tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Detection
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q

  # The Discovery harness is standard-library only and needs no VM to check
  # itself: the manifest invariants and the harness's own tests both run here,
  # in well under a second. The end-to-end run this manifest describes installs
  # real software and needs a self-hosted runner, so it is deliberately not part
  # of per-commit CI.
  test-discovery:
    name: Discovery tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Discovery
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the manifest
        run: python3 -m tests.manifest_check

      - name: Run the harness's own tests
        run: python3 -m unittest discover -s tests -t . -q

  test-sensor:
    name: Sensor tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: Sensor
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -q

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: uv build

  # Aggregate gate for the matrix above. Branch protection requires a check
  # named exactly "Sensor tests" (the job's pre-matrix name); this reports it.
  # `if: always()` matters: without it a failed leg would leave this job
  # skipped, and skipped jobs satisfy required checks.
  test-sensor-gate:
    name: Sensor tests
    runs-on: ubuntu-latest
    needs: test-sensor
    if: always()
    steps:
      - name: All Sensor matrix legs must pass
        run: test "${{ needs.test-sensor.result }}" = "success"
