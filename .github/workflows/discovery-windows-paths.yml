name: Discovery Windows path semantics

on:
  workflow_dispatch:
  push:
    branches: [codex/discovery-windows-paths]
  pull_request:
    branches: [main]
    paths:
      - "Discovery/**"
      - ".github/workflows/discovery-windows-paths.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-paths:
    name: Windows path regression (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: Discovery
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Run Windows path regressions
        run: uv run --python ${{ matrix.python-version }} pytest adr_discovery/tests_unit/test_windows_paths.py -q

  discovery-regression:
    name: Discovery regression and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Discovery
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --python 3.11
      - name: Run all Discovery tests
        run: uv run --python 3.11 pytest -q
      - name: Lint Discovery
        run: uv run --python 3.11 ruff check .
