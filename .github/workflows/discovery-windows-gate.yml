name: Discovery Windows gate

on:
  push:
    branches: [codex/discovery-windows-gate]
    paths:
      - 'Discovery/**'
      - '.github/workflows/discovery-windows-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Discovery/**'
      - '.github/workflows/discovery-windows-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Gate (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        working-directory: Discovery
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python }}
      - name: Exercise native Windows filesystem behavior
        run: uv run --python ${{ matrix.python }} pytest adr_discovery/tests_unit/test_windows_world.py adr_discovery/tests_unit/test_gate_tree_bounds.py -q

  linux:
    name: Linux Discovery regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Discovery
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra dev --python 3.11
      - name: Run Discovery regression suite
        run: uv run --python 3.11 pytest -q
      - name: Lint Discovery
        run: uv run --python 3.11 ruff check .
