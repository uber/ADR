[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adr-discovery"
version = "0.1.0"
description = "ADR Discovery - Agentic Detection & Response: inventory the AI tools present on an endpoint"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "ADR Project Contributors" },
]
keywords = ["security", "ai-agents", "discovery", "inventory", "shadow-ai", "mcp", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Discovery runs on endpoints that may not reach PyPI, so the collector is
# standard-library-only wherever the standard library suffices. The single
# exception is TOML on Python 3.9 and 3.10, which have no tomllib: parsing
# Codex's config with a hand-written subset lost quoted keys and any comma
# inside a string, so a compliant parser is a dependency rather than a nicety.
dependencies = [
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.0",
]

[project.scripts]
adr-discovery = "adr_discovery.cli:main"

[project.urls]
Homepage = "https://github.com/uber/ADR"
Documentation = "https://github.com/uber/ADR/tree/main/Discovery"
Repository = "https://github.com/uber/ADR"
Issues = "https://github.com/uber/ADR/issues"

[tool.setuptools.packages.find]
include = ["adr_discovery*"]

[tool.setuptools.package-data]
# catalog.json is the only non-Python file in the package and every discovery
# run reads it. Without this the installed wheel omits it and `adr-discovery`
# dies on a missing file at import-adjacent time.
adr_discovery = ["catalog.json"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
